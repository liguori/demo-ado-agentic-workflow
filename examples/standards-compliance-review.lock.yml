  - bash: |
      # --- ado-aw generated bindings (do not edit) ---
      # shellcheck disable=SC2016
      AGENT_TEMP='$(Agent.TempDirectory)'
      # shellcheck disable=SC2016
      PIPELINE_WORKSPACE='$(Pipeline.Workspace)'
      ALLOWED_DOMAINS='*.applicationinsights.azure.com,*.blob.core.windows.net,*.copilot.github.com,*.dev.azure.com,*.github.com,*.githubcopilot.com,*.githubusercontent.com,*.in.applicationinsights.azure.com,*.msauth.net,*.msauthimages.net,*.msftauth.net,*.pkgs.dev.azure.com,*.queue.core.windows.net,*.table.core.windows.net,*.visualstudio.com,*.vsassets.io,*.vsblob.visualstudio.com,*.vsrm.dev.azure.com,*.vssps.visualstudio.com,aex.dev.azure.com,aexus.dev.azure.com,api.github.com,config.edge.skype.com,copilot-proxy.githubusercontent.com,dc.services.visualstudio.com,dev.azure.com,github.com,graph.microsoft.com,login.live.com,login.microsoftonline.com,login.windows.net,management.azure.com,pkgs.dev.azure.com,rt.services.visualstudio.com,vsrm.dev.azure.com,vssps.dev.azure.com,vstoken.dev.azure.com'
      # --- end generated bindings ---
      set -o pipefail

      AGENT_OUTPUT_FILE="$AGENT_TEMP/staging/logs/agent-output.txt"
      mkdir -p "$AGENT_TEMP/staging/logs"
      AGENT_EXIT_CODE=0

      echo "=== Running AI agent with AWF network isolation ==="
      echo "Allowed domains: $ALLOWED_DOMAINS"

      # AWF provides L7 domain whitelisting via a rootless Docker topology.
      # The named MCPG container is attached to AWF's internal network as a
      # trusted endpoint; the agent has no route to the host.
      # AWF auto-mounts /tmp:/tmp:rw into the container, so copilot binary,
      # agent prompt, and MCP config are placed under /tmp/awf-tools/.
      # The argument list is assembled into an array so runtime-supplied
      # fragments splice in as ordinary shell statements (`AWF_ARGS+=(...)`)
      # — no `\`-continuation chain to break with fragment marker comments.
      AWF_ARGS=(
        --allow-domains "$ALLOWED_DOMAINS"
        --network-isolation
      )
      AWF_ARGS+=(--topology-attach "awmg-mcpg")
      AWF_ARGS+=(--image-tag "0.27.32")
      AWF_ARGS+=(--skip-pull --env-all)
      AWF_ARGS+=(--exclude-env CARGO_REGISTRY_TOKEN --exclude-env PIP_EXTRA_INDEX_URL --exclude-env VSS_NUGET_ACCESSTOKEN --exclude-env VSS_NUGET_EXTERNAL_FEED_ENDPOINTS)
      AWF_ARGS+=(
        --container-workdir "$WORKING_DIRECTORY"
        --log-level info
        --proxy-logs-dir "$AGENT_TEMP/staging/logs/firewall"
      )
      AWF_ARGS+=(-- 'export NO_PROXY="${NO_PROXY:+$NO_PROXY,}awmg-mcpg"; export no_proxy="$NO_PROXY"; /tmp/awf-tools/copilot --prompt="$(cat /tmp/awf-tools/agent-prompt.md)" --additional-mcp-config @/tmp/awf-tools/mcp-config.json --model gpt-5.6-luna --disable-builtin-mcps --no-ask-user --allow-tool github --allow-tool safeoutputs --allow-tool "shell(cat)" --allow-tool "shell(ls)" --allow-tool "shell(grep)" --allow-tool "shell(find)" --allow-tool "shell(head)" --allow-tool "shell(tail)" --allow-tool "shell(wc)" --allow-tool "shell(jq)" --allow-tool "shell(git:*)"')

      # Stream agent output in real-time while filtering VSO commands.
      # sed -u = unbuffered (line-by-line) so output appears immediately.
      # tee writes to both stdout (ADO pipeline log) and the artifact file.
      # pipefail (set above) ensures AWF's exit code propagates through the pipe.
      # shellcheck disable=SC2016 # The single-quoted engine command inside AWF_ARGS is intentionally expanded by AWF inside the sandbox
      "$PIPELINE_WORKSPACE/awf/awf" "${AWF_ARGS[@]}" 2>&1 \
        | sed -u 's/##vso\[/[VSO-FILTERED] vso[/g; s/##\[/[VSO-FILTERED] [/g' \
        | tee "$AGENT_OUTPUT_FILE" \
        || AGENT_EXIT_CODE=$?

      # Print firewall summary if available
      if [ -x "$PIPELINE_WORKSPACE/awf/awf" ]; then
        echo "=== Firewall Summary ==="
        "$PIPELINE_WORKSPACE/awf/awf" logs summary --source "$AGENT_TEMP/staging/logs/firewall" 2>/dev/null || true
      fi

      exit "$AGENT_EXIT_CODE"
    displayName: Run copilot (AWF network isolated)
